name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"   # mesma versão do Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      # Os testes rodam em modo mock (NFSE_MOCK=1): nada é enviado ao governo.
      - run: pytest -q
